name: Connectly app packages

on:
  push:
    branches:
      - phase-1-auth-friends
    paths:
      - "android/**"
      - "desktop/**"
      - ".github/workflows/package-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build installable debug APK
        working-directory: android
        env:
          CONNECTLY_WEB_URL: https://connectly-gamma-lyart.vercel.app
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: connectly-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows NSIS installer
        working-directory: desktop
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: connectly-windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Debian installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Debian package
        working-directory: desktop
        run: npm run dist:linux

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: connectly-linux-deb
          path: desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 30
